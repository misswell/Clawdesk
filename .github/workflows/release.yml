name: Release Clawdesk

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clawdesk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize, and publish
    runs-on: macos-14
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve and validate version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            [[ "$tag" == "v$version" ]] || {
              echo "Tag $tag does not match Info.plist version v$version" >&2
              exit 1
            }
          else
            tag="v$version"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $tag already exists; refusing to overwrite it." >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Preparing Clawdesk $version ($tag)"

      - name: Run tests
        run: swift test

      - name: Build, notarize, staple, and verify
        shell: bash
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/clawdesk-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          certificate_path="$RUNNER_TEMP/clawdesk-developer-id.p12"

          cleanup() {
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -f "$certificate_path"
          }
          trap cleanup EXIT

          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path" >/dev/null
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security >/dev/null
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

          CLAWDESK_ARCHS="arm64 x86_64" \
          CLAWDESK_DEVELOPER_ID="$APPLE_DEVELOPER_ID" \
          CLAWDESK_DEVELOPER_TEAM_ID="$APPLE_TEAM_ID" \
          CLAWDESK_NOTARY_APPLE_ID="$APPLE_ID" \
          CLAWDESK_NOTARY_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD" \
              scripts/distribute-app.sh

          app="dist/Clawdesk.app"
          codesign --verify --deep --strict "$app"
          codesign --display --verbose=4 "$app" 2>&1 | tee "$RUNNER_TEMP/clawdesk-signature.txt"
          grep -q '^Authority=Developer ID Application:' "$RUNNER_TEMP/clawdesk-signature.txt"
          grep -q "^TeamIdentifier=$APPLE_TEAM_ID$" "$RUNNER_TEMP/clawdesk-signature.txt"
          spctl --assess --type execute --verbose "$app"
          for binary in Clawdesk ClawdeskStatusline ClawdeskUpdater; do
            architectures="$(lipo -archs "$app/Contents/MacOS/$binary")"
            [[ "$architectures" == *arm64* ]] || { echo "$binary lacks arm64" >&2; exit 1; }
            [[ "$architectures" == *x86_64* ]] || { echo "$binary lacks x86_64" >&2; exit 1; }
          done

      - name: Publish GitHub Release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          archive="dist/release/Clawdesk-${RELEASE_VERSION}-macos.zip"
          [[ -f "$archive" ]] || { echo "Missing release archive: $archive" >&2; exit 1; }
          gh release create "$RELEASE_TAG" "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Clawdesk $RELEASE_VERSION" \
            --generate-notes
